spring:
  profiles:
    include: "h2"

server:
  port: 8080

logging:
  level:
    org: 
      springframework: 
        jdbc:
          datasource: 
            init:
              ScriptUtils: "debug"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: when_authorized

---
spring:
  config:
    activate:
      on-profile: "desarrollo"
server:
  port: 8081
---
spring:
  config:
    activate:
      on-profile: "pruebas"
server:
  port: 8082
---
spring:
  config:
    activate:
      on-profile: "produccion"
server:
  port: 9000
